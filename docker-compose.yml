version: '3.8'

services:
  agrobey-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrobey_production_app
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agrobey-network

networks:
  agrobey-network:
    driver: bridge
